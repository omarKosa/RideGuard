name: ride_guard
description: Motorcycle ride analytics - calibrated lean angle, top speed and braking analysis.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.3.0
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  http: ^1.5.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  wakelock_plus: ^1.3.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - backend/app/catalogue/bikes.json
