name: ride_guard
description: A motorcycle rider app that tracks speed, rotation, and calculates ride metrics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^4.0.2
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

